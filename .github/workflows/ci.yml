# Verifies the repository (tests, javadoc, sources) with the organisation's Maven pipeline:
# krizaka/.github/.github/workflows/maven.yml. Its job reports `maven / Verify (tests, javadoc, sources)`, the check main requires.
# There is no code yet: a change that touches only Markdown, docs or the licence or workflows skips the build (reported « Skipped », which passes).
# Drop this `ignore` the day the first module (pom.xml, mvnw) lands.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@b53d9fa9dc1c759d7a27709059dc99f867c63e5b # main
    with:
      upstreams: "krizaka-build"
      ignore: '^[^/]+\.md$|^docs/|^\.changeset/|^(LICENSE|NOTICE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.gitignore$|^\.claude/|^\.github/workflows/|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'
    secrets: inherit # zizmor: ignore[secrets-inherit] the org's own pinned pipeline; it reads SONAR_TOKEN and nothing else of the repository's secrets
